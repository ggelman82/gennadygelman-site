<style>

:root{--ink:#0e1734;--soft:#5a6383;--faint:#8a91a8;--paper:#f7f8fb;--surface:#fff;--line:rgba(14,23,52,.12);--line-2:rgba(14,23,52,.07);
--accent:#3b54c4;--tint:#e7ecf6;--bar:#0e1734;--good:#2f6b48;color-scheme:light}
:root[data-theme="dark"]{--ink:#e7eaf3;--soft:#a6aec6;--faint:#7f88a5;--paper:#0a0f1e;--surface:#131a2e;--line:rgba(231,234,243,.14);--line-2:rgba(231,234,243,.08);
--accent:#93a6ff;--tint:#1b2340;--bar:#060a15;--good:#8fd0a8;color-scheme:dark}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
body{margin:0;background:var(--paper);color:var(--ink);font-family:Geist,system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--accent)}
.wrap{max-width:860px;margin:0 auto;padding:0 clamp(16px,4vw,32px)}
header.top{position:sticky;top:0;z-index:20;background:var(--bar);color:#fff}
.top .wrap{max-width:1080px;display:flex;align-items:center;gap:18px;height:64px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff;font-weight:600;font-size:15px;white-space:nowrap}
.mark{width:30px;height:30px;border-radius:50%;border:1.5px solid rgba(255,255,255,.75);display:grid;place-items:center;font-size:11px}
.top nav{margin-left:auto;display:flex;gap:18px;align-items:center}
.top nav a{color:#fff;text-decoration:none;font-size:14px;opacity:.85}.top nav a:hover{opacity:1;text-decoration:underline;text-underline-offset:4px}
.theme{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:1px solid rgba(255,255,255,.35)}
.theme svg{width:18px;height:18px;fill:none;stroke:#fff;stroke-width:2;stroke-linecap:round}.theme .moon{display:none}
:root[data-theme="dark"] .theme .moon{display:block}:root[data-theme="dark"] .theme .sun{display:none}
@media (max-width:440px){.bn{display:none}}
.vnav{border-bottom:1px solid var(--line-2);background:var(--paper)}
.vnav ul{list-style:none;margin:0 auto;padding:12px clamp(16px,4vw,32px);max-width:1080px;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.vnav ul::-webkit-scrollbar{display:none}
.vnav a{display:block;white-space:nowrap;text-decoration:none;font-size:14px;padding:6px 13px;border-radius:999px;border:1px solid var(--line);color:var(--soft);background:var(--surface)}
.vnav a:hover{color:var(--ink)}.vnav a[aria-current="page"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
.hero{padding:clamp(34px,6vw,60px) 0 10px}
.eyebrow{font-family:"Geist Mono",monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 12px}
h1{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(46px,8vw,80px);line-height:1;letter-spacing:-.025em;margin:0}
.sub{font-family:Newsreader,Georgia,serif;font-style:italic;font-size:clamp(22px,3vw,28px);color:var(--accent);margin:6px 0 0}
.lede{color:var(--soft);font-size:clamp(17px,2vw,19px);max-width:56ch;margin:16px 0 0}
.glance{margin:28px 0 8px;display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--line);border-radius:18px;background:var(--surface);overflow:hidden}
@media (max-width:760px){.glance{grid-template-columns:1fr 1fr}}
.glance div{padding:16px 18px;border-right:1px solid var(--line-2)}
.glance div:last-child{border-right:0}
@media (max-width:760px){.glance div:nth-child(2){border-right:0}.glance div:nth-child(-n+2){border-bottom:1px solid var(--line-2)}}
.glance dt{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--faint);margin:0 0 4px}
.glance dd{margin:0;font-size:15.5px;line-height:1.4;font-weight:500}
section.s{padding:clamp(28px,5vw,44px) 0;border-bottom:1px solid var(--line)}
.num{font-family:"Geist Mono",monospace;font-size:12px;color:var(--faint)}
section.s h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(28px,4vw,38px);line-height:1.1;letter-spacing:-.01em;margin:6px 0 16px}
section.s p{margin:0 0 14px;max-width:64ch}
.note{font-size:14.5px;color:var(--soft)}
.ref{font-size:11px;vertical-align:super;text-decoration:none;margin-left:2px;font-family:"Geist Mono",monospace}
.ref + .ref{margin-left:3px}
.stat{display:flex;gap:18px;align-items:baseline;flex-wrap:wrap;background:var(--tint);border-radius:16px;padding:18px 20px;margin:4px 0 18px;max-width:64ch}
.stat .big{font-family:Newsreader,Georgia,serif;font-size:clamp(38px,6vw,54px);line-height:1;color:var(--accent);letter-spacing:-.02em}
.stat span:last-child{flex:1;min-width:220px;font-size:15.5px}
ul.checks{list-style:none;padding:0;margin:0 0 14px;max-width:64ch}
ul.checks>li{position:relative;padding:6px 0 6px 30px}
ul.checks>li::before{content:"";position:absolute;left:4px;top:13px;width:12px;height:7px;border-left:2.5px solid var(--good);border-bottom:2.5px solid var(--good);transform:rotate(-45deg)}
ul.checks ul{margin:6px 0 0;padding-left:18px;color:var(--soft);font-size:15.5px}
ul.checks ul li{padding:2px 0}
.tablewrap{overflow-x:auto;margin:6px 0 16px}
table.opts{border-collapse:collapse;width:100%;min-width:460px;background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;font-size:15.5px}
table.opts th{text-align:left;font-family:"Geist Mono",monospace;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);padding:12px 14px;border-bottom:1px solid var(--line)}
table.opts td{padding:12px 14px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.opts tr:last-child td{border-bottom:0}
table.opts td:first-child{font-weight:600}
.remember{padding:clamp(30px,5vw,48px) 0}
.remember h2{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:clamp(28px,4vw,38px);margin:0 0 18px}
.rgrid{display:grid;grid-template-columns:1fr 1fr;gap:12px;counter-reset:r}
@media (max-width:620px){.rgrid{grid-template-columns:1fr}}
.rgrid div{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px 18px;counter-increment:r}
.rgrid div::before{content:counter(r,decimal-leading-zero);font-family:"Geist Mono",monospace;font-size:12px;color:var(--faint);display:block;margin-bottom:6px}
.rgrid b{display:block;font-size:16.5px;line-height:1.35}
.rgrid span{color:var(--soft);font-size:15px}
.sources{padding:8px 0 40px}
.sources h2{font-family:"Geist Mono",monospace;font-weight:500;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--faint);margin:0 0 10px}
.sources ul{margin:0;padding-left:20px;font-size:15px;color:var(--soft)}
.sources li{padding:3px 0}
.sources li:target{background:var(--tint);border-radius:6px}
.disclaim{border-top:1px solid var(--line);padding:22px 0 50px;font-size:14px;color:var(--soft)}
.disclaim p{margin:0 0 6px}
footer{background:var(--bar);color:rgba(255,255,255,.85);font-size:13px}
footer .wrap{max-width:1080px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;padding-top:24px;padding-bottom:24px}
footer a{color:inherit;text-decoration:none}
/* hub */
.hub{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:30px 0 20px}
@media (max-width:860px){.hub{grid-template-columns:1fr 1fr}}
@media (max-width:480px){.hub{grid-template-columns:1fr}}
.hub a{display:flex;flex-direction:column;gap:6px;justify-content:flex-start;min-height:150px;padding:18px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .16s ease,box-shadow .16s ease}
.hub a:hover{transform:translateY(-3px);box-shadow:0 14px 30px -20px rgba(14,23,52,.55)}
.hub .nm{font-family:Newsreader,Georgia,serif;font-size:28px;line-height:1.05}
.hub .who{font-size:14px;color:var(--soft);margin-top:auto}
.hub .k{font-family:"Geist Mono",monospace;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
a:focus-visible,button:focus-visible{outline:3px solid var(--accent);outline-offset:3px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
@media print{header.top,.vnav,footer,.theme{display:none}body{background:#fff;color:#000}}

.crumb{display:inline-block;margin-top:22px;color:var(--soft);text-decoration:none;font-size:.95rem}.crumb:hover{color:var(--ink)}
.cnotice{margin:18px 0 0;padding:12px 16px;border-radius:12px;background:var(--tint);font-size:.92rem;color:var(--soft)}
.cnotice b{color:var(--ink)}
.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:18px 0}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:18px 0}
@media (max-width:860px){.grid3{grid-template-columns:1fr 1fr}}
@media (max-width:560px){.grid2,.grid3{grid-template-columns:1fr}}
.card{display:flex;flex-direction:column;gap:6px;padding:16px 18px;border-radius:16px;background:var(--surface);border:1px solid var(--line);text-decoration:none;color:var(--ink);transition:transform .15s ease,box-shadow .15s ease}
a.card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(15,23,42,.08)}
.card .k{font:600 .7rem/1.2 'Geist Mono',ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--faint)}
.card .nm{font-weight:600;font-size:1.02rem}
.card .nm.serif{font-family:Newsreader,Georgia,serif;font-weight:400;font-size:1.45rem;line-height:1.15}
.card .ds{color:var(--soft);font-size:.93rem;line-height:1.5}
.card .go{margin-top:auto;padding-top:6px;font-size:.88rem;color:var(--accent)}
.prose p,.prose li{font-size:1.08rem;line-height:1.7}
.prose img{max-width:100%;height:auto;border-radius:10px}
.prose figure{margin:26px 0}
.prose figcaption{font-size:.85rem;color:var(--faint);margin-top:8px}
.prose blockquote{margin:22px 0;padding:6px 0 6px 18px;border-left:3px solid var(--accent);color:var(--soft)}
.prose h2{margin-top:40px}
.prose table{width:100%;border-collapse:collapse;font-size:.95rem;margin:18px 0}
.prose th,.prose td{border-bottom:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
</style>

<script>
(function(){
const f=document.getElementById('app');
function fit(){try{const d=f.contentDocument;f.style.height=Math.max(600,d.documentElement.scrollHeight)+'px'}catch(e){}}
function setup(){
  const d=f.contentDocument; if(!d) return;
  const s=d.createElement('style');
  s.textContent=`.site-header,.ac-page>footer{display:none!important}
  html,body{background:transparent!important}
  .ac-page{padding-top:0!important;margin-top:0!important;max-width:none!important}
  body{font-family:Geist,system-ui,-apple-system,"Segoe UI",sans-serif!important}
  h1{font-family:Newsreader,Georgia,serif!important;font-weight:400!important}`;
  d.head.appendChild(s);
  const l=d.createElement('link');l.rel='stylesheet';l.href='https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Newsreader:opsz,wght@6..72,400&display=swap';d.head.appendChild(l);
  d.querySelectorAll('a[href^="/"]').forEach(a=>a.target='_top');
  fit(); if('ResizeObserver' in window) new ResizeObserver(fit).observe(d.documentElement);
  d.addEventListener('click',()=>setTimeout(fit,60));
}
if(f.contentDocument&&f.contentDocument.readyState==='complete')setup(); f.addEventListener('load',setup);
})();
</script>
